# Деплой на VPS после push в master: git pull, сборка SPA, Docker prod, rsync в /var/www.
#
# Secrets (repository):
#   SSH_HOST   — хост (например 51.250.18.236)
#   SSH_USER   — пользователь SSH (например mafia)
#   SSH_KEY    — приватный ключ (тот же, что для входа на сервер)
#   DEPLOY_PATH — опционально; абсолютный путь к репо на сервере. По умолчанию ~/polemica-fantasy
#
# На сервере: доступ по SSH к GitHub для git pull; для sudo rsync — NOPASSWD или интерактив не нужен в CI.

name: Deploy VPS

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            DEPLOY_BASE="${{ secrets.DEPLOY_PATH }}"
            if [ -z "$DEPLOY_BASE" ]; then
              DEPLOY_BASE="$HOME/polemica-fantasy"
            fi
            cd "$DEPLOY_BASE"
            git pull origin master
            (cd polemica-fantasy-webapp && npm ci && npm run build)
            (cd polemica-fantasy-admin && npm ci && npm run build)
            docker compose -f docker-compose.prod.yml up -d --build
            sudo rsync -a --delete "$DEPLOY_BASE/polemica-fantasy-webapp/dist/" /var/www/fantasy.maftourbot.ru/
            sudo rsync -a --delete "$DEPLOY_BASE/polemica-fantasy-admin/dist/" /var/www/admin.fantasy.maftourbot.ru/
