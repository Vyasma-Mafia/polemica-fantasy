# Deployed on VPS as /etc/nginx/sites-available/fantasy.maftourbot.ru (certbot manages SSL).
# Backend: docker compose -f docker-compose.prod.yml → 127.0.0.1:18080
# Static: /var/www/fantasy.maftourbot.ru (sync from polemica-fantasy-webapp/dist)

server {
    server_name fantasy.maftourbot.ru;

    root /var/www/fantasy.maftourbot.ru;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    client_max_body_size 10M;

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/fantasy.maftourbot.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fantasy.maftourbot.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = fantasy.maftourbot.ru) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    server_name fantasy.maftourbot.ru;
    return 404;
}
