# Live on VPS: /etc/nginx/sites-enabled/admin.fantasy.maftourbot.ru (certbot manages SSL).
# Admin SPA + /api → 127.0.0.1:18080

server {
    server_name admin.fantasy.maftourbot.ru;

    root /var/www/admin.fantasy.maftourbot.ru;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    client_max_body_size 100M;

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/admin.fantasy.maftourbot.ru/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/admin.fantasy.maftourbot.ru/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = admin.fantasy.maftourbot.ru) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name admin.fantasy.maftourbot.ru;
    return 404; # managed by Certbot


}
