spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USER}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 10000
      idle-timeout: 600000
      max-lifetime: 1800000
      maximum-pool-size: 20
      minimum-idle: 5
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
  flyway:
    enabled: true
    clean-disabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  cache:
    type: caffeine
    cache-names: globalRating
    caffeine:
      spec: maximumSize=1, expireAfterWrite=5m
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

s3:
  endpoint: ${S3_ENDPOINT:http://localhost:9000}
  # If set, used for URLs returned in API; else endpoint. Use in Docker (S3 client → minio:9000, browsers → localhost:9000).
  public-base-url: ${S3_PUBLIC_BASE_URL:}
  region: ${S3_REGION:us-east-1}
  bucket: ${S3_BUCKET:polemica-fantasy-images}
  access-key: ${S3_ACCESS_KEY}
  secret-key: ${S3_SECRET_KEY}
  ensure-bucket-on-startup: ${S3_ENSURE_BUCKET:true}

telegram:
  bot:
    token: ${TELEGRAM_BOT_TOKEN:}
    notifications:
      enabled: ${TELEGRAM_NOTIFICATIONS_ENABLED:true}
  support:
    enabled: ${TELEGRAM_SUPPORT_ENABLED:false}
    forum-chat-id: ${TELEGRAM_SUPPORT_FORUM_CHAT_ID:-1003620873111}
    webhook-secret: ${TELEGRAM_SUPPORT_WEBHOOK_SECRET:}
  league-import:
    enabled: ${TELEGRAM_LEAGUE_IMPORT_ENABLED:false}
    ingest-enabled: ${TELEGRAM_LEAGUE_IMPORT_INGEST_ENABLED:false}
    operator-notifications-enabled: ${TELEGRAM_LEAGUE_IMPORT_OPERATOR_NOTIFICATIONS_ENABLED:false}
    callback-enabled: ${TELEGRAM_LEAGUE_IMPORT_CALLBACK_ENABLED:false}
    result-processing-enabled: ${TELEGRAM_LEAGUE_IMPORT_RESULT_PROCESSING_ENABLED:false}
    production-writes-enabled: ${TELEGRAM_LEAGUE_IMPORT_PRODUCTION_WRITES_ENABLED:false}
    ocr-roster-enabled: ${TELEGRAM_LEAGUE_IMPORT_OCR_ROSTER_ENABLED:false}
    roster-writes-enabled: ${TELEGRAM_LEAGUE_IMPORT_ROSTER_WRITES_ENABLED:false}
    source-channel-peer-id: ${TELEGRAM_LEAGUE_IMPORT_SOURCE_CHANNEL_PEER_ID:0}
    operator-chat-id: ${TELEGRAM_LEAGUE_IMPORT_OPERATOR_CHAT_ID:0}
    ingest-key-id: ${TELEGRAM_LEAGUE_IMPORT_INGEST_KEY_ID:current}
    ingest-current-secret: ${TELEGRAM_LEAGUE_IMPORT_INGEST_CURRENT_SECRET:}
    ingest-previous-key-id: ${TELEGRAM_LEAGUE_IMPORT_INGEST_PREVIOUS_KEY_ID:}
    ingest-previous-secret: ${TELEGRAM_LEAGUE_IMPORT_INGEST_PREVIOUS_SECRET:}
    callback-signing-secret: ${TELEGRAM_LEAGUE_IMPORT_CALLBACK_SIGNING_SECRET:}
    admin-base-url: ${TELEGRAM_LEAGUE_IMPORT_ADMIN_BASE_URL:https://admin.fantasy.maftourbot.ru}
    automation-cutover-at: ${TELEGRAM_LEAGUE_IMPORT_AUTOMATION_CUTOVER_AT:}
    policy-generation: ${TELEGRAM_LEAGUE_IMPORT_POLICY_GENERATION:disabled}
    policies:
      lp:
        enabled: ${TELEGRAM_LEAGUE_IMPORT_LP_ENABLED:false}
        tournament-id: ${TELEGRAM_LEAGUE_IMPORT_LP_TOURNAMENT_ID:0}
        name-template: ${TELEGRAM_LEAGUE_IMPORT_LP_NAME_TEMPLATE:ЛП. Серия %d}
        name-prefix: ${TELEGRAM_LEAGUE_IMPORT_LP_NAME_PREFIX:}
        timezone: Europe/Moscow
        team-deadline-offset-minutes: 10
        expected-game-count: ${TELEGRAM_LEAGUE_IMPORT_LP_EXPECTED_GAME_COUNT:5}
        expected-roster-count: ${TELEGRAM_LEAGUE_IMPORT_LP_EXPECTED_ROSTER_COUNT:10}
        create-mode: ${TELEGRAM_LEAGUE_IMPORT_LP_CREATE_MODE:DISABLED}
        finalize-mode: ${TELEGRAM_LEAGUE_IMPORT_LP_FINALIZE_MODE:DISABLED}
      zl:
        enabled: ${TELEGRAM_LEAGUE_IMPORT_ZL_ENABLED:false}
        tournament-id: ${TELEGRAM_LEAGUE_IMPORT_ZL_TOURNAMENT_ID:0}
        name-template: ${TELEGRAM_LEAGUE_IMPORT_ZL_NAME_TEMPLATE:ЗЛ. Серия %d}
        name-prefix: ${TELEGRAM_LEAGUE_IMPORT_ZL_NAME_PREFIX:}
        timezone: Europe/Moscow
        team-deadline-offset-minutes: 10
        expected-game-count: ${TELEGRAM_LEAGUE_IMPORT_ZL_EXPECTED_GAME_COUNT:5}
        expected-roster-count: ${TELEGRAM_LEAGUE_IMPORT_ZL_EXPECTED_ROSTER_COUNT:10}
        roster-nickname-aliases:
          "Градиент": "Gradient"
          "Cristo I": "Cristo"
          "[Doc.]": "Doc"
        create-mode: ${TELEGRAM_LEAGUE_IMPORT_ZL_CREATE_MODE:DISABLED}
        finalize-mode: ${TELEGRAM_LEAGUE_IMPORT_ZL_FINALIZE_MODE:DISABLED}

polemica:
  api:
    base-url: https://app.polemicagame.com
    # Reserved for future library support; profile games use default host in polemica-library
    profile-site-base-url: ${POLEMICA_PROFILE_SITE_BASE_URL:https://polemicagame.com}
    username: ${POLEMICA_USERNAME:}
    password: ${POLEMICA_PASSWORD:}

app:
  webapp-base-url: ${WEBAPP_BASE_URL:https://fantasy.maftourbot.ru}
  api-credentials:
    trust-x-real-ip: ${APP_API_CREDENTIALS_TRUST_X_REAL_IP:false}
  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:defaultPassword123}
    moderator-username: ${ADMIN_MODERATOR_USERNAME:}
    moderator-password: ${ADMIN_MODERATOR_PASSWORD:}
  rating:
    # Excluded from global rating (e.g. admins). Override: APP_RATING_EXCLUDEDTELEGRAMIDS=1,2,3
    excluded-telegram-ids: []

easter-egg:
  tyulenchik-image-url: https://storage.yandexcloud.net/random/supawork-783fb4354cee4534816e03dbac540bbb.webp

management:
  endpoints:
    web:
      exposure:
        include: info, health, prometheus
  server:
    port: 8081

---
spring:
  config:
    activate:
      on-profile: dev
  jpa:
    show-sql: true
  logging:
    level:
      org.hibernate.SQL: DEBUG
