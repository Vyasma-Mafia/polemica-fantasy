spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USER}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 10000
      idle-timeout: 600000
      max-lifetime: 1800000
      maximum-pool-size: 20
      minimum-idle: 5
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
  flyway:
    enabled: true
    clean-disabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

s3:
  endpoint: ${S3_ENDPOINT:http://localhost:9000}
  # If set, used for URLs returned in API; else endpoint. Use in Docker (S3 client → minio:9000, browsers → localhost:9000).
  public-base-url: ${S3_PUBLIC_BASE_URL:}
  region: ${S3_REGION:us-east-1}
  bucket: ${S3_BUCKET:polemica-fantasy-images}
  access-key: ${S3_ACCESS_KEY}
  secret-key: ${S3_SECRET_KEY}
  ensure-bucket-on-startup: ${S3_ENSURE_BUCKET:true}

telegram:
  bot:
    token: ${TELEGRAM_BOT_TOKEN:}
    notifications:
      enabled: ${TELEGRAM_NOTIFICATIONS_ENABLED:true}
  support:
    enabled: ${TELEGRAM_SUPPORT_ENABLED:false}
    forum-chat-id: ${TELEGRAM_SUPPORT_FORUM_CHAT_ID:-1003620873111}
    webhook-secret: ${TELEGRAM_SUPPORT_WEBHOOK_SECRET:}

polemica:
  api:
    base-url: https://app.polemicagame.com
    # Reserved for future library support; profile games use default host in polemica-library
    profile-site-base-url: ${POLEMICA_PROFILE_SITE_BASE_URL:https://polemicagame.com}
    username: ${POLEMICA_USERNAME:}
    password: ${POLEMICA_PASSWORD:}

app:
  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:defaultPassword123}

management:
  endpoints:
    web:
      exposure:
        include: info, health, prometheus
  server:
    port: 8081

---
spring:
  config:
    activate:
      on-profile: dev
  jpa:
    show-sql: true
  logging:
    level:
      org.hibernate.SQL: DEBUG
