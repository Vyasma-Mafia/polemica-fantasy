# Production/VPS: PostgreSQL + API on localhost for nginx; S3 = Yandex Object Storage (see .env).
# Same endpoint/region pattern as ~/personal/mafia/overlay/.env.example (storage.yandexcloud.net, ru-central1).
# Usage from repo root:
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Nginx proxies to http://127.0.0.1:${BACKEND_HTTP_PORT:-18080}

services:
  fantasy-db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: fantasy
      POSTGRES_USER: ${DB_USER:-fantasy}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-fantasy}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-15433}:5432"
    volumes:
      - fantasy-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-fantasy}"]
      interval: 10s
      retries: 5
      timeout: 5s

  fantasy-backend:
    build: ./polemica-fantasy-backend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:${BACKEND_HTTP_PORT:-18080}:8080"
      - "127.0.0.1:${BACKEND_MANAGEMENT_PORT:-18081}:8081"
    environment:
      DATABASE_URL: jdbc:postgresql://fantasy-db:5432/fantasy
      DATABASE_USER: ${DB_USER:-fantasy}
      DATABASE_PASSWORD: ${DB_PASSWORD:-fantasy}
      S3_ENDPOINT: ${S3_ENDPOINT:-https://storage.yandexcloud.net}
      S3_REGION: ${S3_REGION:-ru-central1}
      S3_BUCKET: ${S3_BUCKET:-polemica-fantasy}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_ENSURE_BUCKET: ${S3_ENSURE_BUCKET:-false}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_NOTIFICATIONS_ENABLED: ${TELEGRAM_NOTIFICATIONS_ENABLED:-true}
      TELEGRAM_SUPPORT_ENABLED: ${TELEGRAM_SUPPORT_ENABLED:-false}
      TELEGRAM_SUPPORT_FORUM_CHAT_ID: ${TELEGRAM_SUPPORT_FORUM_CHAT_ID:--1003620873111}
      TELEGRAM_SUPPORT_WEBHOOK_SECRET: ${TELEGRAM_SUPPORT_WEBHOOK_SECRET:-}
      TELEGRAM_LEAGUE_IMPORT_ENABLED: ${TELEGRAM_LEAGUE_IMPORT_ENABLED:-false}
      TELEGRAM_LEAGUE_IMPORT_INGEST_ENABLED: ${TELEGRAM_LEAGUE_IMPORT_INGEST_ENABLED:-false}
      TELEGRAM_LEAGUE_IMPORT_OPERATOR_NOTIFICATIONS_ENABLED: ${TELEGRAM_LEAGUE_IMPORT_OPERATOR_NOTIFICATIONS_ENABLED:-false}
      TELEGRAM_LEAGUE_IMPORT_CALLBACK_ENABLED: ${TELEGRAM_LEAGUE_IMPORT_CALLBACK_ENABLED:-false}
      TELEGRAM_LEAGUE_IMPORT_RESULT_PROCESSING_ENABLED: ${TELEGRAM_LEAGUE_IMPORT_RESULT_PROCESSING_ENABLED:-false}
      TELEGRAM_LEAGUE_IMPORT_PRODUCTION_WRITES_ENABLED: ${TELEGRAM_LEAGUE_IMPORT_PRODUCTION_WRITES_ENABLED:-false}
      TELEGRAM_LEAGUE_IMPORT_OCR_ROSTER_ENABLED: ${TELEGRAM_LEAGUE_IMPORT_OCR_ROSTER_ENABLED:-false}
      TELEGRAM_LEAGUE_IMPORT_ROSTER_WRITES_ENABLED: ${TELEGRAM_LEAGUE_IMPORT_ROSTER_WRITES_ENABLED:-false}
      TELEGRAM_LEAGUE_IMPORT_SOURCE_CHANNEL_PEER_ID: ${TELEGRAM_LEAGUE_IMPORT_SOURCE_CHANNEL_PEER_ID:-0}
      TELEGRAM_LEAGUE_IMPORT_OPERATOR_CHAT_ID: ${TELEGRAM_LEAGUE_IMPORT_OPERATOR_CHAT_ID:-0}
      TELEGRAM_LEAGUE_IMPORT_INGEST_KEY_ID: ${TELEGRAM_LEAGUE_IMPORT_INGEST_KEY_ID:-current}
      TELEGRAM_LEAGUE_IMPORT_INGEST_CURRENT_SECRET: ${TELEGRAM_LEAGUE_IMPORT_INGEST_CURRENT_SECRET:-}
      TELEGRAM_LEAGUE_IMPORT_INGEST_PREVIOUS_KEY_ID: ${TELEGRAM_LEAGUE_IMPORT_INGEST_PREVIOUS_KEY_ID:-}
      TELEGRAM_LEAGUE_IMPORT_INGEST_PREVIOUS_SECRET: ${TELEGRAM_LEAGUE_IMPORT_INGEST_PREVIOUS_SECRET:-}
      TELEGRAM_LEAGUE_IMPORT_CALLBACK_SIGNING_SECRET: ${TELEGRAM_LEAGUE_IMPORT_CALLBACK_SIGNING_SECRET:-}
      TELEGRAM_LEAGUE_IMPORT_ADMIN_BASE_URL: ${TELEGRAM_LEAGUE_IMPORT_ADMIN_BASE_URL:-https://admin.fantasy.maftourbot.ru}
      TELEGRAM_LEAGUE_IMPORT_AUTOMATION_CUTOVER_AT: ${TELEGRAM_LEAGUE_IMPORT_AUTOMATION_CUTOVER_AT:-}
      TELEGRAM_LEAGUE_IMPORT_POLICY_GENERATION: ${TELEGRAM_LEAGUE_IMPORT_POLICY_GENERATION:-disabled}
      TELEGRAM_LEAGUE_IMPORT_LP_ENABLED: ${TELEGRAM_LEAGUE_IMPORT_LP_ENABLED:-false}
      TELEGRAM_LEAGUE_IMPORT_LP_TOURNAMENT_ID: ${TELEGRAM_LEAGUE_IMPORT_LP_TOURNAMENT_ID:-0}
      TELEGRAM_LEAGUE_IMPORT_LP_NAME_TEMPLATE: ${TELEGRAM_LEAGUE_IMPORT_LP_NAME_TEMPLATE:-ЛП. Серия %d}
      TELEGRAM_LEAGUE_IMPORT_LP_NAME_PREFIX: ${TELEGRAM_LEAGUE_IMPORT_LP_NAME_PREFIX:-}
      TELEGRAM_LEAGUE_IMPORT_LP_EXPECTED_GAME_COUNT: ${TELEGRAM_LEAGUE_IMPORT_LP_EXPECTED_GAME_COUNT:-5}
      TELEGRAM_LEAGUE_IMPORT_LP_EXPECTED_ROSTER_COUNT: ${TELEGRAM_LEAGUE_IMPORT_LP_EXPECTED_ROSTER_COUNT:-10}
      TELEGRAM_LEAGUE_IMPORT_LP_CREATE_MODE: ${TELEGRAM_LEAGUE_IMPORT_LP_CREATE_MODE:-DISABLED}
      TELEGRAM_LEAGUE_IMPORT_LP_FINALIZE_MODE: ${TELEGRAM_LEAGUE_IMPORT_LP_FINALIZE_MODE:-DISABLED}
      TELEGRAM_LEAGUE_IMPORT_ZL_ENABLED: ${TELEGRAM_LEAGUE_IMPORT_ZL_ENABLED:-false}
      TELEGRAM_LEAGUE_IMPORT_ZL_TOURNAMENT_ID: ${TELEGRAM_LEAGUE_IMPORT_ZL_TOURNAMENT_ID:-0}
      TELEGRAM_LEAGUE_IMPORT_ZL_NAME_TEMPLATE: ${TELEGRAM_LEAGUE_IMPORT_ZL_NAME_TEMPLATE:-ЗЛ. Серия %d}
      TELEGRAM_LEAGUE_IMPORT_ZL_NAME_PREFIX: ${TELEGRAM_LEAGUE_IMPORT_ZL_NAME_PREFIX:-}
      TELEGRAM_LEAGUE_IMPORT_ZL_EXPECTED_GAME_COUNT: ${TELEGRAM_LEAGUE_IMPORT_ZL_EXPECTED_GAME_COUNT:-5}
      TELEGRAM_LEAGUE_IMPORT_ZL_EXPECTED_ROSTER_COUNT: ${TELEGRAM_LEAGUE_IMPORT_ZL_EXPECTED_ROSTER_COUNT:-10}
      TELEGRAM_LEAGUE_IMPORT_ZL_CREATE_MODE: ${TELEGRAM_LEAGUE_IMPORT_ZL_CREATE_MODE:-DISABLED}
      TELEGRAM_LEAGUE_IMPORT_ZL_FINALIZE_MODE: ${TELEGRAM_LEAGUE_IMPORT_ZL_FINALIZE_MODE:-DISABLED}
      POLEMICA_USERNAME: ${POLEMICA_USERNAME:-}
      POLEMICA_PASSWORD: ${POLEMICA_PASSWORD:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-defaultPassword123}
      APP_RATING_EXCLUDEDTELEGRAMIDS: ${APP_RATING_EXCLUDEDTELEGRAMIDS:-}
      LOGGING_FILE_NAME: /var/log/polemica-fantasy/backend.json
      LOGGING_STRUCTURED_FORMAT_FILE: logstash
      LOGGING_STRUCTURED_JSON_STACKTRACE_MAX_LENGTH: 16384
      LOGGING_LOGBACK_ROLLINGPOLICY_MAX_FILE_SIZE: 10MB
      LOGGING_LOGBACK_ROLLINGPOLICY_TOTAL_SIZE_CAP: 100MB
      LOGGING_LOGBACK_ROLLINGPOLICY_MAX_HISTORY: 7
      # Polemica library logs the configured username at INFO while refreshing auth.
      LOGGING_LEVEL_COM_GITHUB_MAFIA_VYASMA_POLEMICA_LIBRARY: WARN
    volumes:
      - /var/log/polemica-fantasy:/var/log/polemica-fantasy
    depends_on:
      fantasy-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/actuator/health >/dev/null"]
      interval: 15s
      retries: 10
      timeout: 5s
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  telegram-import-auth:
    profiles: ["telegram-import"]
    build: ./scripts/telegram-league-import
    restart: "no"
    env_file:
      - ${TELEGRAM_IMPORT_ENV_FILE:-./.env.telegram-import}
    environment:
      TELEGRAM_IMPORT_SESSION_DIR: /var/lib/telegram-import
      TELEGRAM_IMPORT_REQUIRED_SOURCE_CIDR: ${TELEGRAM_IMPORT_REQUIRED_SOURCE_CIDR:-172.24.0.0/28}
    volumes:
      - type: bind
        source: ${TELEGRAM_IMPORT_SESSION_DIR:-./.telegram-import-session}
        target: /var/lib/telegram-import
        bind:
          create_host_path: false
    user: "${TELEGRAM_IMPORT_UID:-1000}:${TELEGRAM_IMPORT_GID:-1000}"
    stdin_open: true
    tty: true
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - telegram-import-vpn

  telegram-import-worker:
    profiles: ["telegram-import"]
    build: ./scripts/telegram-league-import
    restart: on-failure:5
    env_file:
      - ${TELEGRAM_IMPORT_ENV_FILE:-./.env.telegram-import}
    environment:
      TELEGRAM_IMPORT_MODE: SHADOW
      TELEGRAM_IMPORT_DELIVERY_MODE: ${TELEGRAM_IMPORT_DELIVERY_MODE:-DIRECT}
      TELEGRAM_IMPORT_OCR_ENABLED: ${TELEGRAM_IMPORT_OCR_ENABLED:-false}
      TELEGRAM_IMPORT_OCR_API_URL: ${TELEGRAM_IMPORT_OCR_API_URL:-https://ocr.api.cloud.yandex.net/ocr/v1/recognizeText}
      TELEGRAM_IMPORT_OCR_TIMEOUT_SECONDS: ${TELEGRAM_IMPORT_OCR_TIMEOUT_SECONDS:-30}
      TELEGRAM_IMPORT_OCR_MAX_ATTEMPTS: ${TELEGRAM_IMPORT_OCR_MAX_ATTEMPTS:-8}
      TELEGRAM_IMPORT_OCR_MAX_MEDIA_BYTES: ${TELEGRAM_IMPORT_OCR_MAX_MEDIA_BYTES:-10485760}
      TELEGRAM_IMPORT_OCR_MAX_PIXELS: ${TELEGRAM_IMPORT_OCR_MAX_PIXELS:-20000000}
      TELEGRAM_IMPORT_SESSION_DIR: /var/lib/telegram-import
      TELEGRAM_IMPORT_REQUIRED_SOURCE_CIDR: ${TELEGRAM_IMPORT_REQUIRED_SOURCE_CIDR:-172.24.0.0/28}
    command: ["worker"]
    volumes:
      - type: bind
        source: ${TELEGRAM_IMPORT_SESSION_DIR:-./.telegram-import-session}
        target: /var/lib/telegram-import
        bind:
          create_host_path: false
    user: "${TELEGRAM_IMPORT_UID:-1000}:${TELEGRAM_IMPORT_GID:-1000}"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "/app/auth.py", "health"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 90s
    networks:
      - telegram-import-vpn


volumes:
  fantasy-postgres-data:

networks:
  telegram-import-vpn:
    external: true
    name: polemica-telegram-import-vpn
